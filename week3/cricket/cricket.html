<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            text-align: center;
            padding: 30px;
        }

        .scoreboard {
            width: 600px;
            margin: 30px auto;
            background: black;
            color: white;
            padding: 50px;
            border-radius: 8px;
        }

        .scoreboard h1 {
            margin-bottom: 30px;
            font-size: 40px;
        }

        .scoreboard h2 {
            margin: 20px 0;
        }

        p {
            margin: 20px 0;
            font-size: 18px;
        }

        button {
            padding: 10px 18px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <h2>Cricket Score Board</h2>

    <div class="scoreboard">
        <h1>Cricket Score Board</h1>

        <h2>Balls : <span id="balls">0</span></h2>

        <h2>Runs : <span id="runs">0</span></h2>
    </div>

    <p>You get total of 6 balls (1 over). The button gets disabled after that.</p>

    <button id="hitBtn">Click to hit the ball</button>
    <button id="resetBtn">Reset Game</button>

    <script src="/Week3/crik.js"></script>

</body>

</html>
