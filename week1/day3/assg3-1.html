<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid calculator</title>
    <style>
        *{
            text-align: center;
        }
        .cont{
            width:300px;
            height: 500px;
            border: 2px solid black;
            padding:30px;
            display: grid;
            margin: auto;
            border-radius: 10px;
            border: none;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(5,1fr);
            background-color: rgb(255, 255, 255);
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);

        }
        .cont div{
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .op{
            background-color: black;
            color: aliceblue;
            padding:20px;
            width:40px;
            height:40px;
        }
        .no{
            background-color: white;
            width:40px;
            height:40px;
        }
        #clear{
            background-color: red;
            color:white;
            width:40px;
            height:40px;
        }
        #R{
            grid-column: 1/5;
            height: 50px;
            
        }
        .op:hover{
            background-color: rgb(104, 100, 100);
        }
        .no:hover{
            background-color: rgb(211, 206, 206);
            color: rgb(255, 255, 255);
        }
        #clear:hover{
            background-color: rgb(102, 8, 224);
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <h1>Calculator</h1>
    <div class="cont">
        <div id="R"></div>
        <div class="no">1</div>
        <div class="no">2</div>
        <div class="no">3</div>
        <div class="op">+</div>
        <div class="no">4</div>
        <div class="no">5</div>
        <div class="no">6</div>
        <div class="op">-</div>
        <div class="no">7</div>
        <div class="no">8</div>
        <div class="no">9</div>
        <div class="op">*</div>
        <div id="clear">C</div>
        <div class="no">0</div>
        <div class="op">=</div>
        <div class="op">/</div>
    </div>
    
</body>
</html>
