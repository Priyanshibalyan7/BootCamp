<!DOCTYPE html>
<html>
<head>
	<title>Registration</title>
</head>
<body>
	<input type="text" name="name" id="name" placeholder="name">
	<select id="gender">
		<option value="">--</option>
		<option value="male">M</option>
		<option value="female">F</option>
	</select>
	<input type="text" name="email" id="email" placeholder="email">
	<input type="text" name="mobile" id="mobile" placeholder="mobile">
	<hr>
	<h1 id="dName">NAME</h1>
	<h2 id="dGender">GENDER</h2>
	<h3 id="dEmail">EMAIL</h3>
	<h4 id="dMobile">MOBILE</h4>
	<hr>
	<button onclick="showName()">NAME</button>
	<button onclick="showGender()">GENDER</button>
	<button onclick="showEmail()">EMAIL</button>
	<button onclick="showMobile()">MOBILE</button>
	<button onclick="resetForm()">RESET FORM</button>
	<button onclick="resetDisplay()">RESET DISPLAY</button>
	<script type="text/javascript">
		function showName() {
			// Show filled name inside h1
            let ski = document.getElementById("name")
            let nme = document.getElementById("dName").innerText=ski.value
            

		}

		function showGender() {
			// Show the selected gender inside h2
            let ski = document.getElementById("gender")
            let nme = document.getElementById("dGender").innerText=ski.value
            

		}

		function showEmail() {
			// Show the filled email inside 
            let ski = document.getElementById("email")
            let nme = document.getElementById("dEmail").innerText=ski.value
            

		}

		function showMobile() {
			// Show the filled mobile inside h4
            let ski = document.getElementById("mobile")
            let nme = document.getElementById("dMobile").innerText=ski.value
            

		}

		function resetForm() {
			// Reset all the form elements to default values (blank "")
            let ski = document.querySelectorAll("input")
            ski.forEach(function(input){
                input.value=""
            })
            let nme = document.getElementById("gender").innerHTML=""
            

		}

		function resetDisplay() {
			// Reset all the headings (h1, h2, h3, h4) to blank values
            let ski = document.querySelectorAll("h1,h2,h3,h4")
            ski.forEach(function(h){
                h.innerText = " "
            })
		}
	</script>
</body>
</html>
